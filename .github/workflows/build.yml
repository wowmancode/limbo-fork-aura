name: Build Limbo APK

# Builds the x86 guest emulator (runs Windows/DOS-style x86 OSes) for
# arm64-v8a phones by default - that covers virtually all modern Android
# devices, including Pixel phones.
#
# Trigger manually from the Actions tab, or on every push.
on:
  workflow_dispatch:
    inputs:
      build_host:
        description: "Android device architecture (host)"
        required: true
        default: "arm64-v8a"
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86, x86_64]
      build_guest:
        description: "Emulated architecture (guest)"
        required: true
        default: "x86_64-softmmu"
        type: choice
        options: [x86_64-softmmu, aarch64-softmmu, ppc64-softmmu, sparc64-softmmu]
  push:
    branches: [master]

env:
  # Versions pinned to what limbo's included patches target - see
  # limbo-android-lib/src/main/jni/patches/ and README.developers
  QEMU_VERSION: 5.1.0
  GLIB_VERSION: 2.56.1
  LIBFFI_VERSION: 3.3
  PIXMAN_VERSION: 0.40.0
  SDL2_VERSION: 2.0.8
  NDK_VERSION: 23.2.8568313 # r23b, matches android-limbo-config.mak's clang default
  JNI_DIR: limbo-android-lib/src/main/jni

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake git python3 binutils \
            libtool-bin pkg-config flex bison gettext texinfo rsync

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Android NDK r23b
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            --install "ndk;${NDK_VERSION}" >/dev/null
          echo "NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache downloaded third-party sources
        id: cache-src
        uses: actions/cache@v4
        with:
          path: /tmp/src-cache
          key: limbo-src-${{ env.QEMU_VERSION }}-${{ env.GLIB_VERSION }}-${{ env.LIBFFI_VERSION }}-${{ env.PIXMAN_VERSION }}-${{ env.SDL2_VERSION }}

      - name: Download QEMU, glib, libffi, pixman, SDL2
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/src-cache
          cd /tmp/src-cache
          wget -nv "https://download.qemu-project.org/qemu-${QEMU_VERSION}.tar.xz"
          wget -nv "https://ftp.gnome.org/pub/GNOME/sources/glib/2.56/glib-${GLIB_VERSION}.tar.xz"
          wget -nv "https://sourceware.org/pub/libffi/libffi-${LIBFFI_VERSION}.tar.gz"
          wget -nv "https://www.cairographics.org/releases/pixman-${PIXMAN_VERSION}.tar.gz"
          wget -nv "https://www.libsdl.org/release/SDL2-${SDL2_VERSION}.tar.gz"

      - name: Extract sources and apply Limbo's patches
        run: |
          cd "${JNI_DIR}"
          tar -xJf "/tmp/src-cache/qemu-${QEMU_VERSION}.tar.xz"
          mv "qemu-${QEMU_VERSION}" qemu
          tar -xJf "/tmp/src-cache/glib-${GLIB_VERSION}.tar.xz"
          mv "glib-${GLIB_VERSION}" glib
          tar -xzf "/tmp/src-cache/libffi-${LIBFFI_VERSION}.tar.gz"
          mv "libffi-${LIBFFI_VERSION}" libffi
          tar -xzf "/tmp/src-cache/pixman-${PIXMAN_VERSION}.tar.gz"
          mv "pixman-${PIXMAN_VERSION}" pixman
          tar -xzf "/tmp/src-cache/SDL2-${SDL2_VERSION}.tar.gz"
          mv "SDL2-${SDL2_VERSION}" SDL2

          (cd qemu && patch -p1 < "../patches/qemu-${QEMU_VERSION}.patch")
          (cd glib && patch -p1 < "../patches/glib-${GLIB_VERSION}.patch")
          (cd SDL2 && patch -p1 < "../patches/sdl2-${SDL2_VERSION}.patch")

      - name: Build native libraries (make limbo)
        env:
          BUILD_HOST: ${{ inputs.build_host || 'arm64-v8a' }}
          BUILD_GUEST: ${{ inputs.build_guest || 'x86_64-softmmu' }}
          USE_QEMU_VERSION: ${{ env.QEMU_VERSION }}
        run: |
          cd "${JNI_DIR}"
          make limbo -j"$(nproc)"

      - name: Set up Gradle wrapper
        run: gradle wrapper --gradle-version 7.0.2

      - name: Build APK
        run: ./gradlew :limbo-android-x86:assembleRelease --stacktrace

      - name: Locate and upload APK
        run: |
          mkdir -p out
          find . -name "*.apk" -path "*limbo-android-x86*" -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: limbo-x86-${{ inputs.build_host || 'arm64-v8a' }}
          path: out/*.apk
          if-no-files-found: error
