name: Build Limbo APK

# Builds the x86 guest emulator (runs Windows/DOS-style x86 OSes) for
# arm64-v8a phones by default - that covers virtually all modern Android
# devices, including Pixel phones.
#
# Trigger manually from the Actions tab, or on every push.
on:
  workflow_dispatch:
    inputs:
      build_host:
        description: "Android device architecture (host)"
        required: true
        default: "arm64-v8a"
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86, x86_64]
      build_guest:
        description: "Emulated architecture (guest)"
        required: true
        default: "x86_64-softmmu"
        type: choice
        options: [x86_64-softmmu, aarch64-softmmu, ppc64-softmmu, sparc64-softmmu]
  push:
    branches: [master]

env:
  # Versions pinned to what limbo's included patches target - see
  # limbo-android-lib/src/main/jni/patches/ and README.developers
  QEMU_VERSION: 5.1.0
  GLIB_VERSION: 2.56.1
  LIBFFI_VERSION: 3.3
  PIXMAN_VERSION: 0.40.0
  SDL2_VERSION: 2.0.8
  NDK_VERSION: 23.2.8568313 # r23b, matches android-limbo-config.mak's clang default
  JNI_DIR: limbo-android-lib/src/main/jni

jobs:
  # Fast feedback: compiles just the Java/Android code (no native QEMU build),
  # so app-code mistakes show up in a few minutes instead of after ~30.
  java-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android platform 29 and build-tools 29.0.3
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-29" "build-tools;29.0.3" >/dev/null

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle 7.0.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.0.2"

      - name: Compile Java
        run: gradle :limbo-android-x86:compileDebugJavaWithJavac --stacktrace

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake git python3 binutils \
            libtool-bin pkg-config flex bison gettext texinfo rsync

      # sdkmanager itself needs Java 17+, so install SDK/NDK pieces using the
      # runner's bundled JDK 17 *before* switching to JDK 11 for the old
      # Android Gradle Plugin (4.1.1) this project uses.
      - name: Install Android NDK r23b, platform 29, build-tools 29.0.3
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;${NDK_VERSION}" "platforms;android-29" "build-tools;29.0.3" >/dev/null
          echo "NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Cache downloaded third-party sources
        id: cache-src
        uses: actions/cache@v4
        with:
          path: /tmp/src-cache
          key: limbo-src-v2-${{ env.QEMU_VERSION }}-${{ env.GLIB_VERSION }}-${{ env.LIBFFI_VERSION }}-${{ env.PIXMAN_VERSION }}-${{ env.SDL2_VERSION }}

      - name: Download QEMU, glib, libffi, pixman, SDL2
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/src-cache
          cd /tmp/src-cache
          # fetch <output file> <url> [fallback url...] - tries each URL in turn
          fetch() {
            out="$1"; shift
            for url in "$@"; do
              echo "Downloading $out from $url"
              if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o "$out" "$url"; then
                return 0
              fi
              echo "::warning::Failed: $url"
            done
            echo "::error::Could not download $out from any mirror"
            return 1
          }
          fetch qemu.tar.xz \
            "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz" \
            "https://download.qemu-project.org/qemu-${QEMU_VERSION}.tar.xz"
          fetch glib.tar.xz \
            "https://download.gnome.org/sources/glib/2.56/glib-${GLIB_VERSION}.tar.xz" \
            "https://ftp.gnome.org/pub/GNOME/sources/glib/2.56/glib-${GLIB_VERSION}.tar.xz"
          fetch libffi.tar.gz \
            "https://github.com/libffi/libffi/releases/download/v${LIBFFI_VERSION}/libffi-${LIBFFI_VERSION}.tar.gz" \
            "https://sourceware.org/pub/libffi/libffi-${LIBFFI_VERSION}.tar.gz"
          fetch pixman.tar.gz \
            "https://www.cairographics.org/releases/pixman-${PIXMAN_VERSION}.tar.gz" \
            "https://xorg.freedesktop.org/releases/individual/lib/pixman-${PIXMAN_VERSION}.tar.gz"
          fetch SDL2.tar.gz \
            "https://www.libsdl.org/release/SDL2-${SDL2_VERSION}.tar.gz" \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz" \
            "https://github.com/libsdl-org/SDL/archive/refs/tags/release-${SDL2_VERSION}.tar.gz"
          ls -la

      - name: Extract sources and apply Limbo's patches
        run: |
          cd "${JNI_DIR}"
          # Extract each archive into a fixed folder name regardless of the
          # top-level folder name inside the tarball (it differs between mirrors).
          for lib in qemu glib libffi pixman SDL2; do
            archive=$(ls /tmp/src-cache/${lib}.tar.*)
            mkdir -p "$lib"
            tar -xf "$archive" --strip-components=1 -C "$lib"
          done

          (cd qemu && patch -p1 < "../patches/qemu-${QEMU_VERSION}.patch")
          (cd glib && patch -p1 < "../patches/glib-${GLIB_VERSION}.patch")
          (cd SDL2 && patch -p1 < "../patches/sdl2-${SDL2_VERSION}.patch")

      - name: Build native libraries (make limbo)
        env:
          BUILD_HOST: ${{ inputs.build_host || 'arm64-v8a' }}
          BUILD_GUEST: ${{ inputs.build_guest || 'x86_64-softmmu' }}
          USE_QEMU_VERSION: ${{ env.QEMU_VERSION }}
        run: |
          cd "${JNI_DIR}"
          make limbo -j"$(nproc)"

      - name: Set up Gradle 7.0.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.0.2"

      # Debug build: it's signed with a debug key automatically, so Android
      # will install it directly (an unsigned release APK would be rejected).
      - name: Build APK
        run: gradle :limbo-android-x86:assembleDebug --stacktrace

      - name: Locate and upload APK
        run: |
          mkdir -p out
          find . -name "*.apk" -path "*limbo-android-x86*" -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: limbo-x86-${{ inputs.build_host || 'arm64-v8a' }}
          path: out/*.apk
          if-no-files-found: error
